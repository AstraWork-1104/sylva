<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flora | UI Connection Test</title>
<style>
:root{color-scheme:dark;font-family:Inter,"Segoe UI",sans-serif;background:#101711;color:#e2ecdf}
*{box-sizing:border-box}body{margin:0;padding:32px;min-height:100vh;display:grid;place-items:center}
main{width:min(900px,100%);background:#17221a;border:1px solid #395742;border-radius:16px;box-shadow:0 18px 60px #0006;overflow:hidden}
header{padding:18px 24px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #36503b;background:#1d2921}
.brand{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;background:#b2da91;color:#243b24;font-weight:bold}
header strong{font-size:17px}header span:last-child{margin-left:auto;color:#94aa96;font-size:12px}
.content{padding:24px}.tabs{display:flex;gap:8px;margin-bottom:22px}.tabs button,.scope button,.action{border:1px solid #45604a;border-radius:8px;padding:11px 18px;background:#243629;color:#c9dbc7;cursor:pointer}
.tabs button.active,.scope button.active,.action{background:#365f3d;color:#ecffdf;border-color:#759c63}.tabs button:hover,.scope button:hover{filter:brightness(1.2)}
h1{font-size:22px;margin:0 0 8px}p{color:#9eb3a3;line-height:1.65;font-size:13px;margin:0 0 22px}
.panel{background:#1b2b20;border:1px solid #344b39;padding:20px;border-radius:12px}
.row{display:flex;gap:12px;justify-content:space-between;align-items:center;border-bottom:1px solid #344a39;padding:12px 2px}
.row:last-child{border:0}.row span{color:#b4c9b4}.pill{font-size:11px;padding:4px 10px;background:#2c5034;border-radius:40px;color:#cae8b4}
.scope{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.scope-label{font-size:11px;color:#9cad9f;display:block;margin-top:26px}
footer{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:18px;font-size:12px;color:#a1b3a5}.action{font-weight:600}
#result{color:#acd889;font-size:12px;min-height:16px}
@media(max-width:600px){body{padding:10px}.content{padding:14px}.tabs button,.scope button{padding:9px 12px}footer{flex-wrap:wrap}}
</style>
</head>
<body>
<main>
<header><div class="brand">F</div><strong>Flora / Material Manager</strong><span>GitHub connection test</span></header>
<div class="content">
<nav class="tabs" aria-label="Material Manager sections">
<button class="active" data-tab="Relink">Relink</button>
<button data-tab="Textures">Textures</button>
<button data-tab="Materials">Materials</button>
</nav>
<h1 id="heading">Relink Textures</h1>
<p id="description">Find lost texture files recursively across the configured library roots.</p>
<section class="panel" id="panel">
<div class="row"><span>Search roots</span><span class="pill">3 folders</span></div>
<div class="row"><span>Bitmap + CoronaBitmap</span><span class="pill">Enabled</span></div>
<div class="row"><span>Recursive search</span><span class="pill">Enabled</span></div>
</section>
<label class="scope-label">PROCESSING SCOPE (for cleanup operations)</label>
<div class="scope">
<button data-scope="Flora Plants" class="active">Flora Plants</button>
<button data-scope="Selected Objects">Selected Objects</button>
<button data-scope="Entire Scene">Entire Scene</button>
</div>
<footer><span id="result" role="status">Interactive HTML prototype - no 3ds Max data is modified.</span><button class="action" id="run">Preview operation</button></footer>
</div>
</main>
<script>
const screens={
Relink:{heading:"Relink Textures",description:"Find lost texture files recursively across the configured library roots.",rows:[["Search roots","3 folders"],["Bitmap + CoronaBitmap","Enabled"],["Recursive search","Enabled"]]},
Textures:{heading:"Consolidate Textures",description:"Share a single texture node when file, class and relevant settings match.",rows:[["Bitmap nodes","Supported"],["CoronaBitmap nodes","Supported"],["UV, gamma and map settings","Must match"]]},
Materials:{heading:"Consolidate Materials",description:"Compare supported Corona materials and reuse fully identical references.",rows:[["CoronaPhysicalMtl","Planned"],["CoronaLegacyMtl","Planned"],["Full parameter and map match","Required"]]}
};
let current="Relink",scope="Flora Plants";
document.querySelectorAll("[data-tab]").forEach(button=>button.addEventListener("click",()=>{
current=button.dataset.tab;
document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b===button));
const screen=screens[current];
document.querySelector("#heading").textContent=screen.heading;
document.querySelector("#description").textContent=screen.description;
document.querySelector("#panel").replaceChildren(...screen.rows.map(([key,value])=>{
const row=document.createElement("div");row.className="row";
const label=document.createElement("span");label.textContent=key;
const pill=document.createElement("span");pill.className="pill";pill.textContent=value;
row.append(label,pill);return row;
}));
document.querySelector("#result").textContent="Selected tool: "+current;
}));
document.querySelectorAll("[data-scope]").forEach(button=>button.addEventListener("click",()=>{
scope=button.dataset.scope;
document.querySelectorAll("[data-scope]").forEach(b=>b.classList.toggle("active",b===button));
document.querySelector("#result").textContent="Scope: "+scope;
}));
document.querySelector("#run").addEventListener("click",()=>document.querySelector("#result").textContent="Preview: "+current+" / "+scope+". UI test successful.");
</script>
</body>
</html>
